var PAL=[
  ['#1a0533','#6b21a8'],['#0f172a','#1d4ed8'],['#0c1a0c','#15803d'],
  ['#1a0a00','#c2410c'],['#1a0a1a','#be185d'],['#0a1a1a','#0891b2'],
  ['#1a1500','#ca8a04'],['#0d0d0d','#525252'],['#1a0518','#9333ea'],
  ['#001a10','#059669'],['#1a0000','#dc2626'],['#000e1a','#0284c7']
];
var SHAPES=['🎬','🎞️','📽️','🍿','🎥','📀','🔪','👻','🤖','🚀'];

function mCoverBg(id){
  var p=PAL[id%PAL.length];
  var a=(id*37)%360;
  return 'linear-gradient('+a+'deg,'+p[0]+' 0%,'+p[1]+' 100%)';
}

function mCoverHTML(id,title,small){
  var bg=mCoverBg(id);
  var shape=SHAPES[id%SHAPES.length];
  var short=title.length>22?title.substring(0,20)+'...':title;
  var sz=small?'0.7rem':'0.78rem';
  return '<div class="movie-cover-gen" style="background:'+bg+';display:flex;align-items:center;justify-content:center;">'
    +'<div style="font-size:3rem;opacity:0.2;">'+shape+'</div>'
    +'<div class="movie-cover-text" style="font-size:'+sz+';position:absolute;bottom:0.5rem;left:0;right:0;">'+short+'</div>'
    +'</div>';
}

// ============ SELECT CAT ============
function mSelectCat(catId){
  mCurrentCat=catId;
  document.getElementById('movie-search').value='';
  document.querySelectorAll('.movie-cat-pill').forEach(function(p){p.classList.remove('active');});
  var pill=document.getElementById('mpill-'+catId);
  if(pill) pill.classList.add('active');

  var cat=CATS.find(function(c){return c.id===catId;});
  var lista=FILMES.filter(function(f){return f.cat===catId;});

  document.getElementById('movie-breadcrumb').innerHTML=
    '<span class="vbc-home" onclick="mShowHome()">Início</span>'
    +' <span style="color:rgba(255,255,255,0.15)">›</span> '
    +'<span class="vbc-current">'+(cat?cat.icon+' '+cat.nome:catId)+'</span>';

  var html='<div style="margin-bottom:1.5rem;">'
    +'<div style="font-size:2.5rem;margin-bottom:0.4rem;">'+(cat?cat.icon:'📁')+'</div>'
    +'<h2 style="font-family:Georgia,serif;font-size:2rem;font-weight:700;margin-bottom:0.2rem;">'+(cat?cat.nome:catId)+'</h2>'
    +'<p style="color:#6b6b8a;font-size:0.85rem;">'+lista.length+' filmes disponíveis</p>'
    +'</div>'
    +'<div class="movie-grid" id="movie-main-grid"></div>';

  document.getElementById('movie-content').innerHTML=html;
  var grid=document.getElementById('movie-main-grid');
  lista.forEach(function(f){grid.appendChild(mCreateCard(f));});
}

// ============ SEARCH ============
document.getElementById('movie-search').addEventListener('input',function(){
  var term=this.value.trim().toLowerCase();
  if(term.length<2){
    if(mCurrentCat) mSelectCat(mCurrentCat);
    else mShowHome();
    return;
  }
  var res=FILMES.filter(function(f){
    return f.t.toLowerCase().indexOf(term)>-1||(f.ano && f.ano.toLowerCase().indexOf(term)>-1);
  });
  document.getElementById('movie-breadcrumb').innerHTML=
    '<span class="vbc-home" onclick="mShowHome()">Início</span>'
    +' <span style="color:rgba(255,255,255,0.15)">›</span> '
    +'<span class="vbc-current">🔍 "'+this.value+'"</span>';

  var html='<div style="margin-bottom:1.5rem;">'
    +'<h2 style="font-family:Georgia,serif;font-size:2rem;font-weight:700;margin-bottom:0.2rem;">🔍 Resultados</h2>'
    +'<p style="color:#6b6b8a;font-size:0.85rem;">'+res.length+' filmes encontrados</p>'
    +'</div>'
    +'<div class="movie-grid" id="movie-main-grid"></div>';

  document.getElementById('movie-content').innerHTML=html;
  var grid=document.getElementById('movie-main-grid');
  if(res.length===0){
    grid.innerHTML='<div class="movie-empty"><div class="movie-empty-icon">🎬</div><p>Nenhum resultado.</p></div>';
  } else {
    res.forEach(function(f){grid.appendChild(mCreateCard(f));});
  }
});

// ============ CREATE CARD ============
function mCreateCard(filme){
  var div=document.createElement('div');
  div.className='movie-card';
  div.innerHTML='<div class="movie-card-cover">'
    +mCoverHTML(filme.id,filme.t,false)
    +'<div class="movie-card-overlay">'
    +'<a class="movie-dl-btn-small" href="'+filme.link+'" target="_blank" rel="noopener noreferrer" onclick="mShowToast(\'⬇ Baixando...\',\'green\')">⬇ BAIXAR</a>'
    +'</div>'
    +'</div>'
    +'<div class="movie-card-info">'
    +'<div class="movie-card-title" title="'+filme.t+'" onclick="mOpenModal('+filme.id+')" style="cursor:pointer;">'+filme.t+'</div>'
    +'<div class="movie-card-year">'+(filme.ano?filme.ano:'')+'</div>'
    +'<div class="movie-card-foot"><span class="movie-badge-quality">HD</span><a class="movie-card-dl-direct" href="'+filme.link+'" target="_blank" rel="noopener noreferrer" onclick="mShowToast(\'⬇ Baixando...\',\'green\')">⬇ Baixar</a></div>'
    +'</div>';
  return div;
}

// ============ MODAL ============
function mOpenModal(id){
  var filme=FILMES.find(function(f){return f.id===id;});
  if(!filme) return;
  var cat=CATS.find(function(c){return c.id===filme.cat;});
  document.getElementById('movie-modal-cat').textContent=cat?cat.icon+' '+cat.nome:'';
  document.getElementById('movie-modal-title').textContent=filme.t;
  document.getElementById('movie-modal-year').textContent=filme.ano?filme.ano:'';

  var bg=mCoverBg(filme.id);
  var shape=SHAPES[filme.id%SHAPES.length];
  document.getElementById('movie-modal-art').innerHTML=
    '<button class="movie-modal-close" onclick="mCloseModal()">✕</button>'
    +'<div style="width:100%;height:100%;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:0.15;">'+shape+'</div>'
    +'<div style="position:absolute;inset:0;background:linear-gradient(to top,#0f0f1a,transparent 55%);"></div>'
    +'<div style="position:absolute;bottom:0;left:0;right:0;padding:1rem;">'
    +'<div style="font-family:Georgia,serif;font-size:1.1rem;font-weight:700;color:white;text-shadow:0 2px 8px rgba(0,0,0,0.8);">'+filme.t.substring(0,40)+'</div>'
    +'</div>';

  var dlBtn=document.getElementById('movie-btn-dl');
  dlBtn.href=filme.link;
  dlBtn.onclick=function(){
    mShowToast('⬇ Download iniciado!','green');
    setTimeout(function(){mCloseModal();},400);
    return true;
  };
  document.getElementById('movie-btn-copy').onclick=function(){
    if(navigator.clipboard){
      navigator.clipboard.writeText(filme.link).then(function(){mShowToast('🔗 Link copiado!','yellow');});
    } else {
      var el=document.createElement('textarea');
      el.value=filme.link;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      mShowToast('🔗 Link copiado!','yellow');
    }
  };
  document.getElementById('movie-modal-overlay').classList.add('open');
}

function mCloseModal(){document.getElementById('movie-modal-overlay').classList.remove('open');}
function mHandleModalClick(e){if(e.target===document.getElementById('movie-modal-overlay')) mCloseModal();}
document.addEventListener('keydown',function(e){if(e.key==='Escape') mCloseModal();});

// ============ TOAST ============
function mShowToast(msg,type){
  var stack=document.getElementById('movie-toasts');
  var t=document.createElement('div');
  t.className='movie-toast'+(type==='pink'?' pink':type==='green'?' green':'');
  t.textContent=msg;
  stack.appendChild(t);
  setTimeout(function(){t.remove();},3500);
}
