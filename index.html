:root{--bg:#0d0d0b;--bg2:#1a1a1a;--card:#1f1f1f;--text:#fff;--text2:#b0b0b0;--green:#048243;--green2:#06a355;--border:#2a2a2a;}
body.light{--bg:#f5f5f5;--bg2:#fff;--card:#fff;--text:#1a1a1a;--text2:#555;--border:#ddd;}
body{font-family:'Montserrat','Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:all 0.3s;overflow-x:hidden;}

@keyframes rainFall{0%{transform:translateY(-100px) rotate(0deg);opacity:0.8;}100%{transform:translateY(100vh) rotate(360deg);opacity:0;}}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:50px;padding:8px 16px;cursor:pointer;z-index:10000;display:flex;gap:8px;font-size:14px;font-weight:600;color:var(--text);transition:0.2s;backdrop-filter:blur(10px);}
.theme-toggle:hover{border-color:var(--green);}
.container{max-width:1300px;margin:0 auto;padding:0 20px;}
header{padding:20px 0;}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:20px;}

#menu ul li a{color:var(--text2);text-decoration:none;font-size:14px;font-weight:500;transition:0.2s;cursor:pointer;}
#menu ul li a:hover{color:var(--green);}
.logo{text-align:center;margin:20px 0;}
.logo img{max-width:280px;width:100%;}
#search{max-width:500px;margin:0 auto 30px;display:flex;gap:10px;}
#search input{flex:1;padding:12px 20px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;outline:none;}
#search input:focus{border-color:var(--green);}
#search button{background:var(--green);border:none;padding:0 25px;border-radius:50px;color:white;font-weight:bold;cursor:pointer;transition:0.2s;}
#search button:hover{background:var(--green2);}
.cat-wrapper{position:relative;margin:30px 0;}
.cat-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:14px;color:var(--text);}
.cat-title:after{content:'';display:block;width:60px;height:2px;background:var(--green);margin:6px auto 0;}
.cat-scroll{display:flex;gap:14px;overflow-x:auto;padding:14px 60px;scroll-behavior:smooth;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-scroll a{display:inline-block;flex:0 0 auto;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(6px);color:var(--text);padding:8px 20px;border-radius:999px;font-size:13px;text-decoration:none;white-space:nowrap;transition:all 0.25s ease;cursor:pointer;}
.cat-scroll a:hover{background:var(--green);color:#fff;transform:scale(1.08);}
.cat-scroll a.active{background:var(--green);color:#fff;}
.cat-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,0.1);width:36px;height:36px;border-radius:50%;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;transition:0.2s;}
.cat-btn.prev{left:10px;}.cat-btn.next{right:10px;}

.post_list{margin:40px 0;}
.main_title h2{text-align:center;font-weight:700;font-size:28px;margin-bottom:30px;color:var(--text);}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:25px;}
.post{transition:transform 0.3s;}
.post:hover{transform:translateY(-8px);}
.inner{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.thumb{aspect-ratio:2/3;position:relative;overflow:hidden;}
.thumb-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 30% 40%, rgba(255,255,255,0.15) 0%, transparent 70%);z-index:2;pointer-events:none;}

const CATEGORIAS = [
{id:"all",nome:"Todos"},
{id:"acao",nome:"Ação"},
{id:"terror",nome:"Terror"},
{id:"ficcao",nome:"Ficção"},

];

let currentCategory = "all", currentPage = 1;
const itemsPerPage = 24;

// Cores diferentes para cada álbum (efeito TV chuviscando)
const catColors = {
    acao: ["#8B0000","#DC143C","#FF4500"],
    terror: ["#1a0a0a","#2d0a0a","#3d1a1a"],
    ficcao: ["#0a0a2d","#0a1a3d","#0a2d4a"],
    comedia: ["#2d2d0a","#3d3d0a","#4a4a0a"],
    classicos: ["#1a1a1a","#2a2a2a","#3a3a3a"],
    brasileiros: ["#0a2d0a","#0a3d0a","#0a4a0a"],
    terrorclassico: ["#1a0a1a","#2d0a2d","#3d1a3d"],
    play: ["#0a1a1a","#0a2d2d","#0a3d3d"],
    all: ["#1a2a1a","#0d0d0b","#1a1a2a"]
};

function getGradientColors(cat, index){
    let colors = catColors[cat] || catColors.all;
    let c1 = colors[index % colors.length];
    let c2 = colors[(index+1) % colors.length];
    return `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`;
}

function getTVEffectHTML(cat, index){
    let bgGrad = getGradientColors(cat, index);
    return `<div class="thumb" style="position:relative;">
                <div style="width:100%;height:100%;background:${bgGrad};display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;z-index:1;">
                    <h4 style="color:white;text-shadow:0 0 10px rgba(0,0,0,0.8);">🎬</h4>
                </div>
                <div class="thumb-overlay"></div>
                <div class="thumb-tv-effect"></div>
                <div class="thumb-scanline"></div>
                <div class="thumb-glitch"></div>
            </div>`;
}

function getFiltered(){
    let f = currentCategory === "all" ? FILMES : FILMES.filter(m => m.cat === currentCategory);
    let s = document.getElementById("searchInput").value.toLowerCase();
    if(s.length >= 2) f = f.filter(m => m.t.toLowerCase().includes(s));
    return f;
}

function renderMovies(){
    let f = getFiltered();
    let total = Math.ceil(f.length / itemsPerPage);
    let start = (currentPage-1) * itemsPerPage;
    let pag = f.slice(start, start+itemsPerPage);
    let grid = document.getElementById("moviesGrid");
    grid.innerHTML = "";
    pag.forEach((m, idx) => {
        let cat = m.cat;
        let globalIdx = m.id;
        grid.innerHTML += `<div class="post"><div class="inner">
            ${getTVEffectHTML(cat, globalIdx)}
            <div class="title"><a onclick="openModal(${m.id})">${m.t}</a></div>
            <div class="tags"><span class="badge-year">📅 ${m.ano || "2024"}</span><span class="badge-quality">HD</span></div>
            <a href="${m.link}" target="_blank" class="btn-download">⬇ DOWNLOAD</a>
        </div></div>`;
    });
    let pagHtml = `<span class="current">Pág ${currentPage}</span>`;
    for(let i=1; i<=Math.min(total,12); i++){
        if(i !== currentPage) pagHtml += `<a onclick="changePage(${i})">${i}</a>`;
    }
    document.getElementById("pagination").innerHTML = pagHtml;
}

function changePage(p){ currentPage = p; renderMovies(); window.scrollTo({top:400}); }
function filterCategory(cat){ currentCategory = cat; currentPage = 1; renderMovies(); updateActiveCat(cat); }
function searchMovies(){ currentPage = 1; renderMovies(); }
function showHome(){ currentCategory = "all"; document.getElementById("searchInput").value = ""; currentPage = 1; renderMovies(); updateActiveCat("all"); }
function updateActiveCat(cat){ document.querySelectorAll(".cat-scroll a").forEach(a => a.classList.remove("active")); if(cat==="all") document.querySelector(".cat-scroll a:first-child")?.classList.add("active"); else document.querySelector(`.cat-scroll a[data-cat="${cat}"]`)?.classList.add("active"); }
function openModal(id){ let m = FILMES.find(f => f.id === id); if(m){ document.getElementById("modalTitle").innerText = m.t; document.getElementById("modalYear").innerHTML = `📅 ${m.ano || "2024"} · HD`; document.getElementById("modalLink").href = m.link; document.getElementById("movieModal").classList.add("open"); } }
function closeModal(){ document.getElementById("movieModal").classList.remove("open"); }
function scrollCats(px){ document.getElementById("catScroll").scrollBy({left:px, behavior:"smooth"}); }
function toggleTheme(){ document.body.classList.toggle("light"); }
function renderCats(){
    let bar = document.getElementById("catScroll");
    bar.innerHTML = "";
    CATEGORIAS.forEach(c => {
        let count = c.id === "all" ? FILMES.length : FILMES.filter(f => f.cat === c.id).length;
        bar.innerHTML += `<a data-cat="${c.id}" onclick="filterCategory('${c.id}')" class="${c.id === 'all' ? 'active' : ''}">${c.nome} (${count})</a>`;
    });
}
setInterval(()=>{let m=document.createElement("div"); m.className="meteor"; m.style.left=Math.random()*innerWidth+"px"; m.style.top=Math.random()*innerHeight*0.5+"px"; m.style.animationDuration=0.7+Math.random()*1+"s"; document.getElementById("meteorContainer").appendChild(m); setTimeout(()=>m.remove(),1500);},900);
setInterval(()=>{let f=document.createElement("div"); f.className="video-frame"; f.style.left=Math.random()*innerWidth+"px"; f.style.animationDuration=3+Math.random()*3+"s"; f.innerHTML="📺"; document.getElementById("videoRain").appendChild(f); setTimeout(()=>f.remove(),6000);},1300);
renderCats(); renderMovies();
</script>
