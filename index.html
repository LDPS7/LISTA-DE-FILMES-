<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#0a0a0a;
  --bg2:#111;
  --card:#1a1a1a;
  --text:#fff;
  --text2:#aaa;
  --border:#2a2a2a;
  --neon:#00ff41;
  --neon2:#39ff14;
  --shadow:0 0 20px rgba(0,255,65,0.3);
}

body.light{
  --bg:#f0f0f0;
  --bg2:#fff;
  --card:#fff;
  --text:#111;
  --text2:#555;
  --border:#ddd;
  --shadow:0 0 20px rgba(0,255,65,0.2);
}

body{
  font-family:'Montserrat','Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:all 0.4s;
  overflow-x:hidden;
  min-height:100vh;
}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--neon);border-radius:10px;}

.meteor-container{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9998;
  overflow:hidden;
}

.meteor{
  position:absolute;
  width:2px;
  height:80px;
  background:linear-gradient(to bottom,#ffdd00,transparent);
  opacity:0;
  animation:meteorFall var(--duration,1.2s) ease-out forwards;
  pointer-events:none;
}

@keyframes meteorFall{
  0%{transform:translateX(0) translateY(0) rotate(45deg);opacity:1;}
  100%{transform:translateX(300px) translateY(300px) rotate(45deg);opacity:0;}
}

.video-rain{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9997;
  overflow:hidden;
}

.video-frame{
  position:absolute;
  width:60px;
  height:35px;
  background:rgba(0,0,0,0.45);
  border:1px solid var(--neon);
  border-radius:4px;
  opacity:0;
  animation:rainFall 4s linear forwards;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:white;
  font-family:monospace;
  pointer-events:none;
}

@keyframes rainFall{
  0%{transform:translateY(-100px) rotate(0deg);opacity:0.7;}
  100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
}

/* CALDA DE METEORO VERDE NO MOUSE */
.cursor-trail{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
  overflow:hidden;
}

.trail-dot{
  position:absolute;
  width:8px;
  height:8px;
  background:radial-gradient(circle, rgba(0,255,65,0.85) 0%, rgba(0,255,65,0) 70%);
  border-radius:50%;
  box-shadow:0 0 12px rgba(0,255,65,0.5);
  pointer-events:none;
  animation:trailFade 0.6s linear forwards;
}

@keyframes trailFade{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(0);opacity:0;}
}

.theme-toggle{
  position:fixed;
  top:15px;
  right:15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:50px;
  padding:8px 18px;
  cursor:pointer;
  z-index:10000;
  display:flex;
  gap:8px;
  font-size:13px;
  font-weight:600;
  color:var(--text);
  transition:0.3s;
  backdrop-filter:blur(10px);
}

.theme-toggle:hover{
  border-color:var(--neon);
  box-shadow:var(--shadow);
}

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  position:relative;
  background:var(--bg);
  overflow:hidden;
}

.hero::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:radial-gradient(ellipse at center, rgba(0,255,65,0.05) 0%, transparent 70%);
  z-index:0;
  pointer-events:none;
}

.hero *{
  position:relative;
  z-index:1;
}

.hero-logo{
  font-size:clamp(3rem,10vw,6rem);
  font-weight:900;
  background:linear-gradient(135deg,var(--neon),#00cc33,#39ff14);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
  letter-spacing:-2px;
}

.hero-sub{
  font-size:clamp(1rem,2vw,1.5rem);
  color:var(--text2);
  margin-bottom:40px;
  letter-spacing:4px;
  text-transform:uppercase;
}

.hero-search{
  width:100%;
  max-width:600px;
  margin-bottom:50px;
  position:relative;
}

.hero-search input{
  width:100%;
  padding:16px 50px 16px 25px;
  border-radius:50px;
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:16px;
  outline:none;
  transition:0.3s;
}

.hero-search input:focus{
  border-color:var(--neon);
  box-shadow:var(--shadow);
}

.hero-search .search-icon{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
  color:var(--text2);
  pointer-events:none;
}

.hero-buttons{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:30px;
}

/* BOTÕES DA HOME - VERDE APENAS NO HOVER */
.hero-btn{
  padding:18px 50px;
  border-radius:50px;
  font-size:clamp(1rem,1.5vw,1.2rem);
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s;
  text-transform:uppercase;
  letter-spacing:2px;
  position:relative;
  overflow:hidden;
  background:transparent;
  border:2px solid var(--neon);
  color:var(--neon);
}

.hero-btn:hover{
  background:linear-gradient(135deg,var(--neon),#00cc33);
  color:#000;
  transform:scale(1.05);
  box-shadow:0 0 50px rgba(0,255,65,0.6);
}

.hero-stats{
  display:flex;
  gap:40px;
  margin-top:20px;
  flex-wrap:wrap;
  justify-content:center;
}

.hero-stats span{
  font-size:14px;
  color:var(--text2);
}

.hero-stats strong{
  font-size:22px;
  color:var(--neon);
  display:block;
  text-align:center;
}

.page{
  display:none;
  padding:80px 20px 40px;
  max-width:1400px;
  margin:0 auto;
  animation:fadeIn 0.5s ease;
}

.page.active{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:30px;
}

.page-header h1{
  font-size:clamp(1.8rem,4vw,2.8rem);
}

.page-header h1 span{
  color:var(--neon);
}

.page-header .back-btn{
  padding:10px 25px;
  border:1px solid var(--border);
  border-radius:30px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

.page-header .back-btn:hover{
  border-color:var(--neon);
  box-shadow:var(--shadow);
}

.page-search{
  width:100%;
  max-width:500px;
  margin-bottom:30px;
}

.page-search input{
  width:100%;
  padding:12px 20px;
  border-radius:50px;
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:0.3s;
}

.page-search input:focus{
  border-color:var(--neon);
  box-shadow:var(--shadow);
}

.movies-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}

.movie-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px 15px;
  text-align:center;
  transition:all 0.3s;
  position:relative;
  overflow:hidden;
  z-index:1;
}

.movie-card::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:conic-gradient(
    from 0deg,
    transparent,
    rgba(0,255,65,0.05),
    transparent,
    rgba(0,255,65,0.05),
    transparent
  );
  animation:cardGlow 4s linear infinite;
  opacity:0;
  transition:0.3s;
  pointer-events:none;
  z-index:0;
}

.movie-card:hover::before{
  opacity:1;
}

@keyframes cardGlow{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

.movie-card:hover{
  transform:translateY(-5px);
  border-color:var(--neon);
  box-shadow:0 0 30px rgba(0,255,65,0.15);
}

.movie-card .movie-name{
  font-size:clamp(0.85rem,1.1vw,1rem);
  font-weight:700;
  color:var(--text);
  margin-bottom:8px;
  line-height:1.3;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}

.movie-card .movie-year{
  font-size:12px;
  color:var(--text2);
  margin-bottom:12px;
  position:relative;
  z-index:1;
}

.movie-btn{
  display:inline-block;
  padding:12px 20px;
  border:none;
  border-radius:30px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s;
  text-transform:uppercase;
  letter-spacing:1px;
  text-decoration:none;
  width:100%;
  max-width:180px;
  background:linear-gradient(135deg,var(--neon),#00cc33);
  color:#000;
  box-shadow:0 0 20px rgba(0,255,65,0.2);
  position:relative;
  z-index:2;
  pointer-events:auto;
}

.movie-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 35px rgba(0,255,65,0.5);
}

.pagination{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:40px 0;
}

.pagination button{
  padding:8px 16px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

.pagination button:hover,
.pagination button.active{
  background:var(--neon);
  color:#000;
  border-color:var(--neon);
}

.pagination button:disabled{
  opacity:0.3;
  cursor:not-allowed;
}

.pagination-dots{
  padding:8px 4px;
  color:var(--text2);
  font-weight:700;
}

.total-count{
  text-align:center;
  font-size:14px;
  color:var(--text2);
  margin-bottom:20px;
}

.total-count strong{
  color:var(--neon);
  font-size:18px;
}

@media(max-width:768px){
  .hero-buttons{gap:12px;}
  .hero-btn{
    padding:14px 30px;
    font-size:14px;
    width:100%;
    max-width:280px;
  }
  .movies-grid{
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:15px;
  }
  .movie-card{
    padding:15px 10px;
  }
  .movie-card .movie-name{
    font-size:13px;
    min-height:40px;
  }
  .movie-btn{
    font-size:12px;
    padding:8px 15px;
    max-width:140px;
  }
  .page-header h1{
    font-size:22px;
  }
  .theme-toggle{
    top:10px;
    right:10px;
    padding:6px 14px;
    font-size:12px;
  }
}

@media(max-width:480px){
  .movies-grid{
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
  }
  .hero-logo{
    font-size:2.5rem;
  }
  .hero-sub{
    font-size:0.9rem;
  }
}
</style>
</head>

// SISTEMA OTIMIZADO
// ============================================================

const ITEMS_PER_PAGE = 24;
let currentPage = { terabox: 1, drive: 1 };

function openPage(type){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('pageHome').style.display = 'none';
  document.getElementById('page' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');
  renderPage(type);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome(){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('pageHome').style.display = 'flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateStats();
}

function getData(type){
  return type === 'terabox' ? filmesTerabox : filmesDrive;
}

function getFiltered(type){
  const data = getData(type);
  const search = document.getElementById('search' + type.charAt(0).toUpperCase() + type.slice(1)).value.toLowerCase().trim();

  if(search.length < 2) return data;

  return data.filter(m => m.t.toLowerCase().includes(search));
}

function renderPage(type){
  const data = getFiltered(type);
  const total = data.length;
  const totalPages = Math.ceil(total / ITEMS_PER_PAGE);

  let page = currentPage[type];
  if(page > totalPages) page = totalPages || 1;

  currentPage[type] = page;

  const start = (page - 1) * ITEMS_PER_PAGE;
  const pageItems = data.slice(start, start + ITEMS_PER_PAGE);

  const grid = document.getElementById('grid' + type.charAt(0).toUpperCase() + type.slice(1));

  let cardsHtml = '';

  for(const m of pageItems){
    const anoHtml = m.ano ? `<div class="movie-year">📅 ${m.ano}</div>` : '';

    cardsHtml += `
      <div class="movie-card">
        <div class="movie-name">${m.t}</div>
        ${anoHtml}
        <a href="${m.link}" target="_blank" rel="noopener noreferrer" class="movie-btn">▶ Assistir / Baixar</a>
      </div>
    `;
  }

  grid.innerHTML = cardsHtml;

  document.getElementById('total' + type.charAt(0).toUpperCase() + type.slice(1)).textContent = total;

  document.getElementById('pagination' + type.charAt(0).toUpperCase() + type.slice(1)).innerHTML =
    buildPagination(type, page, totalPages);
}

function pageButton(type, i, current){
  return `<button class="${i === current ? 'active' : ''}" onclick="changePage('${type}', ${i})">${i}</button>`;
}

function buildPagination(type, page, totalPages){
  let html = `<button onclick="changePage('${type}', ${page - 1})" ${page <= 1 ? 'disabled' : ''}>◀</button>`;

  const maxButtons = 7;

  if(totalPages <= maxButtons){
    for(let i = 1; i <= totalPages; i++){
      html += pageButton(type, i, page);
    }
  }else{
    html += pageButton(type, 1, page);

    let start = Math.max(2, page - 2);
    let end = Math.min(totalPages - 1, page + 2);

    if(start > 2){
      html += `<span class="pagination-dots">…</span>`;
    }

    for(let i = start; i <= end; i++){
      html += pageButton(type, i, page);
    }

    if(end < totalPages - 1){
      html += `<span class="pagination-dots">…</span>`;
    }

    html += pageButton(type, totalPages, page);
  }

  html += `<button onclick="changePage('${type}', ${page + 1})" ${page >= totalPages ? 'disabled' : ''}>▶</button>`;

  return html;
}

function changePage(type, page){
  const data = getFiltered(type);
  const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);

  if(page < 1) page = 1;
  if(page > totalPages) page = totalPages || 1;

  currentPage[type] = page;

  renderPage(type);

  window.scrollTo({ top: 300, behavior: 'smooth' });
}

const filterTimers = {};

function filterPage(type){
  clearTimeout(filterTimers[type]);

  filterTimers[type] = setTimeout(() => {
    currentPage[type] = 1;
    renderPage(type);
  }, 200);
}

let searchTimer;

function searchAllMovies(){
  clearTimeout(searchTimer);

  searchTimer = setTimeout(() => {
    const query = document.getElementById('homeSearch').value.toLowerCase().trim();

    if(query.length < 2) return;

    const foundT = filmesTerabox.filter(m => m.t.toLowerCase().includes(query));
    const foundD = filmesDrive.filter(m => m.t.toLowerCase().includes(query));

    if(foundT.length > 0 || foundD.length > 0){
      const type = foundT.length >= foundD.length ? 'terabox' : 'drive';

      openPage(type);

      document.getElementById('search' + type.charAt(0).toUpperCase() + type.slice(1)).value = query;

      renderPage(type);
    }
  }, 200);
}

function updateStats(){
  document.getElementById('countTerabox').textContent = filmesTerabox.length;
  document.getElementById('countDrive').textContent = filmesDrive.length;
  document.getElementById('countTotal').textContent = filmesTerabox.length + filmesDrive.length;
}

function toggleTheme(){
  document.body.classList.toggle('light');
}

function createMeteor(){
  if(document.hidden) return;

  const container = document.getElementById('meteorContainer');

  if(container.childElementCount > 40) return;

  const m = document.createElement('div');
  m.className = 'meteor';
  m.style.left = Math.random() * innerWidth + 'px';
  m.style.top = Math.random() * innerHeight * 0.5 + 'px';
  m.style.setProperty('--duration', (0.7 + Math.random() * 1.2) + 's');

  container.appendChild(m);

  setTimeout(() => m.remove(), 2000);
}

function createVideoFrame(){
  if(document.hidden) return;

  const container = document.getElementById('videoRain');

  if(container.childElementCount > 30) return;

  const f = document.createElement('div');
  f.className = 'video-frame';
  f.style.left = Math.random() * innerWidth + 'px';
  f.style.animationDuration = (3 + Math.random() * 3) + 's';
  f.textContent = ['🎬','📺','🎥','📽'][Math.floor(Math.random() * 4)];

  container.appendChild(f);

  setTimeout(() => f.remove(), 6000);
}

setInterval(createMeteor, 900);
setInterval(createVideoFrame, 1400);

// ============================================================
// CALDA DE METEORO VERDE NO MOUSE
// ============================================================

const trailContainer = document.getElementById('cursorTrail');
let lastTrailTime = 0;
const TRAIL_DELAY = 18;
const MAX_TRAIL = 35;

document.addEventListener('mousemove', (e) => {
  if(document.hidden) return;

  const now = performance.now();

  if(now - lastTrailTime < TRAIL_DELAY) return;

  lastTrailTime = now;

  if(trailContainer.childElementCount > MAX_TRAIL){
    if(trailContainer.firstElementChild){
      trailContainer.firstElementChild.remove();
    }
  }

  const dot = document.createElement('div');
  dot.className = 'trail-dot';
  dot.style.left = (e.clientX - 4) + 'px';
  dot.style.top = (e.clientY - 4) + 'px';

  trailContainer.appendChild(dot);

  setTimeout(() => dot.remove(), 650);
}, { passive: true });
